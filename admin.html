        // ================= UTILIDADES =================
        function esc(valor) {
            return String(valor == null ? "" : valor).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        async function cargarDatos() {
            const tbody = document.getElementById("tablaBody");
            tbody.innerHTML = '<tr><td colspan="6">Cargando resultados...</td></tr>';

            const { data, error } = await supabaseClient
                .from("test_vocacional_resultados")
                .select("*")
                .order("created_at", { ascending: false });

            if (error) {
                tbody.innerHTML = '<tr><td colspan="6" style="color:#f87171;">Error cargando datos: ' + esc(error.message) + '</td></tr>';
                return;
            }

            registrosGlobales = data || [];
            if (!registrosGlobales.length) {
                tbody.innerHTML = '<tr><td colspan="6">Aún no hay resultados registrados.</td></tr>';
                return;
            }

            tbody.innerHTML = registrosGlobales.map((row, idx) => {
                const fecha = new Date(row.created_at).toLocaleString("es-CL");
                const carreras = Array.isArray(row.carreras_sugeridas) ? row.carreras_sugeridas.join(", ") : "";
                return "<tr>" +
                    "<td>" + esc(fecha) + "</td>" +
                    "<td><strong>" + esc(row.nombre_participante || "Anónimo") + "</strong></td>" +
                    "<td>" + esc(row.perfil_principal || "") + "</td>" +
                    "<td>" + esc(row.segundo_perfil || "") + "</td>" +
                    "<td>" + esc(carreras) + "</td>" +
                    '<td><button class="pdf-btn" onclick="generarPDF(' + idx + ', this)">📄 PDF</button></td>' +
                "</tr>";
            }).join("");
        }

        function exportarCSV() {
            if (!registrosGlobales.length) {
                alert("No hay registros para exportar.");
                return;
            }
            const colsP = Array.from({ length: 60 }, (_, i) => "P" + (i + 1)).join(";");
            const headers = "Fecha;Participante;Perfil_1;Perfil_2;R;I;A;S;E;C;Apt_Verbal;Apt_Numerica;Apt_Espacial;Apt_Practica;Apt_Interpersonal;Apt_Organizacion;Carreras;" + colsP;
            const rows = registrosGlobales.map(r => {
                const f = new Date(r.created_at).toLocaleString("es-CL");
                const ri = r.puntajes_riasec || {};
                const ap = r.puntajes_aptitudes || {};
                const resp = r.respuestas || {};
                const todas = [].concat(
                    Array.from({ length: 36 }, (_, i) => (resp.intereses || [])[i] || ""),
                    Array.from({ length: 24 }, (_, i) => (resp.aptitudes || [])[i] || "")
                );
                const carreras = Array.isArray(r.carreras_sugeridas) ? r.carreras_sugeridas.join(", ") : "";
                const limpio = t => String(t == null ? "" : t).replace(/"/g, '""');
                return '"' + f + '";"' + limpio(r.nombre_participante || "Anónimo") + '";"' + limpio(r.perfil_principal) + '";"' + limpio(r.segundo_perfil) + '";' + (ri.R||0) + ';' + (ri.I||0) + ';' + (ri.A||0) + ';' + (ri.S||0) + ';' + (ri.E||0) + ';' + (ri.C||0) + ';' + (ap.V||0) + ';' + (ap.N||0) + ';' + (ap.E||0) + ';' + (ap.P||0) + ';' + (ap.S||0) + ';' + (ap.O||0) + ';"' + limpio(carreras) + '";' + todas.join(";");
            });
            const csv = "\uFEFF" + [headers, ...rows].join("\n");
            const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "Consolidado_Test_Vocacional_" + new Date().toISOString().slice(0,10) + ".csv";
            a.click();
        }

            // Orden fijo de claves (igual que en el test) para que los empates se resuelvan igual
            return orden.map(k => [k, Number((puntajes || {})[k]) || 0]).sort((a, b) => b[1] - a[1]);

        function filaBarra(nombre, puntos, maximo, color) {
            const pct = Math.round((puntos / maximo) * 100);
            return '<div class="bar-row">' +
                '<div class="lbl"><b>' + esc(nombre) + '</b></div>' +
                '<div class="track"><div class="fill" style="width:' + pct + '%; background:' + color + ';"></div></div>' +
                '<div class="val">' + puntos + '/' + maximo + ' · ' + pct + '%</div>' +
            '</div>';
        }

        function bloqueRespuestas(titulo, color, puntajeTxt, preguntas, desde, respuestas, inicioNumero) {
            const filas = preguntas.map((p, i) => {
                const v = Number(respuestas[desde + i]) || 0;
                let dots = "";
                for (let k = 1; k <= 5; k++) dots += '<span class="dot' + (k <= v ? " on" : "") + '"></span>';
                const etiqueta = v ? (v + " · " + ETIQUETAS_RESPUESTA[v]) : "Sin respuesta";
                return '<tr>' +
                    '<td class="n">' + (inicioNumero + i) + '</td>' +
                    '<td class="q">' + esc(p[1]) + '</td>' +
                    '<td class="a"><span class="dots">' + dots + '</span><span class="a-txt">' + esc(etiqueta) + '</span></td>' +
                '</tr>';
            }).join("");
            return '<div class="grupo avoid" style="--c:' + color + ';">' +
                '<div class="grupo-title"><span>' + esc(titulo) + '</span><span>' + esc(puntajeTxt) + '</span></div>' +
                '<table class="resp"><tbody>' + filas + '</tbody></table>' +
            '</div>';
        }

        function construirInforme(r) {
            const ri = r.puntajes_riasec || {};
            const ap = r.puntajes_aptitudes || {};
            const nombre = r.nombre_participante || "Anónimo";
            const fecha = new Date(r.created_at).toLocaleDateString("es-CL", { day: "numeric", month: "long", year: "numeric" });

            const ordenados = ordenar(ri, ORDEN_RIASEC);
            const aptOrdenadas = ordenar(ap, ORDEN_APTITUD);
            const [p1, p2, p3] = ordenados;

            const dif = p1[1] - p2[1];
            const nivel = dif <= 2
                ? "Tus intereses están muy parejos entre tu primer y segundo perfil: ambos te representan casi por igual."
                : dif <= 5
                    ? "Hay una tendencia principal, aunque tu segundo perfil también destaca con fuerza."
                    : "Se observa una preferencia más marcada por tu perfil principal.";

            const brechaApt = aptOrdenadas[0][1] - aptOrdenadas[1][1];
            const lecturaApt = brechaApt <= 2
                ? "Tus dos áreas más altas están bastante cercanas."
                : "Se observa una fortaleza autopercibida más marcada en tu primera área.";

            const carreras = Array.isArray(r.carreras_sugeridas) ? r.carreras_sugeridas : [];
            const carrerasTercer = CARRERAS_PERFIL[p3[0]] || [];

            const barrasRiasec = ordenados.map(([k, v]) => filaBarra(PERFILES[k].nombre + " (" + k + ")", v, 30, COLOR_PERFIL[k])).join("");
            const barrasApt = aptOrdenadas.map(([k, v]) => filaBarra(APTITUDES[k].nombre, v, 20, "#1f6f8b")).join("");

            const fortalezas = aptOrdenadas.slice(0, 2).map(([k]) => APTITUDES[k].nombre);
            const aDesarrollar = aptOrdenadas.slice(-2).map(([k]) => APTITUDES[k].nombre);

            // Sección de respuestas
            let seccionRespuestas = "";
            const resp = r.respuestas;
            if (resp && Array.isArray(resp.intereses) && resp.intereses.length) {
                const apt = Array.isArray(resp.aptitudes) ? resp.aptitudes : [];
                let html = '<div class="rp-sec page-break"><h2>Detalle de tus respuestas <small>60 afirmaciones · escala de 1 a 5</small></h2>' +
                    '<p>Aquí puedes revisar cada afirmación y la opción que marcaste. Los puntos llenos indican qué tan identificado/a te sentiste (1 = nada, 5 = mucho).</p></div>';
                html += '<h3 class="avoid" style="color:#14284b; font-size:11pt; margin:4px 0 8px;">Parte 1 · Intereses vocacionales</h3>';
                ORDEN_RIASEC.forEach((k, g) => {
                    const lista = PREGUNTAS_INTERESES.slice(g * 6, g * 6 + 6);
                    html += bloqueRespuestas(PERFILES[k].nombre + " (" + k + ")", COLOR_PERFIL[k], (ri[k] || 0) + " de 30 pts", lista, g * 6, resp.intereses, g * 6 + 1);
                });
                html += '<h3 class="avoid" style="color:#14284b; font-size:11pt; margin:14px 0 8px;">Parte 2 · Aptitudes percibidas</h3>';
                ORDEN_APTITUD.forEach((k, g) => {
                    const lista = PREGUNTAS_APTITUD.slice(g * 4, g * 4 + 4);
                    html += bloqueRespuestas(APTITUDES[k].nombre, "#1f6f8b", (ap[k] || 0) + " de 20 pts", lista, g * 4, apt, 37 + g * 4);
                });
                seccionRespuestas = html;
            } else {
                seccionRespuestas = '<div class="rp-sec avoid"><h2>Detalle de tus respuestas</h2>' +
                    '<div class="note">El detalle pregunta por pregunta no está disponible para este informe, porque el test se rindió antes de habilitar el registro de respuestas individuales. Los puntajes y resultados de este informe sí están completos.</div></div>';
            }

            return '' +
            '<div class="rp-head avoid">' +
                '<div class="kicker">Orientación 2027</div>' +
                '<h1>Informe Individual de Orientación Vocacional</h1>' +
                '<div class="sub">Intereses (modelo RIASEC) y aptitudes percibidas</div>' +
            '</div>' +
            '<div class="rp-meta avoid">' +
                '<div><span>Participante</span><strong>' + esc(nombre) + '</strong></div>' +
                '<div><span>Fecha de aplicación</span><strong>' + esc(fecha) + '</strong></div>' +
                '<div><span>Combinación dominante</span><strong>' + esc(p1[0] + p2[0]) + ' · ' + esc(PERFILES[p1[0]].nombre) + ' + ' + esc(PERFILES[p2[0]].nombre) + '</strong></div>' +
            '</div>' +

            '<div class="rp-sec avoid">' +
                '<h2>Tu perfil de intereses</h2>' +
                '<div class="cards">' +
                    '<div class="card" style="--c:' + COLOR_PERFIL[p1[0]] + ';"><div class="tag">Perfil principal</div><div class="name">' + esc(PERFILES[p1[0]].nombre) + '</div><p class="desc">' + esc(PERFILES[p1[0]].descripcion) + '</p></div>' +
                    '<div class="card" style="--c:' + COLOR_PERFIL[p2[0]] + ';"><div class="tag">Segundo perfil</div><div class="name">' + esc(PERFILES[p2[0]].nombre) + '</div><p class="desc">' + esc(PERFILES[p2[0]].descripcion) + '</p></div>' +
                    '<div class="card" style="--c:' + COLOR_PERFIL[p3[0]] + ';"><div class="tag">Tercer perfil</div><div class="name">' + esc(PERFILES[p3[0]].nombre) + '</div><p class="desc">' + esc(PERFILES[p3[0]].descripcion) + '</p></div>' +
                '</div>' +
                '<div class="callout"><strong>Lectura del resultado:</strong> ' + esc(nivel) + '</div>' +
            '</div>' +

            '<div class="rp-sec avoid">' +
                '<h2>Resultado de los seis perfiles <small>máximo 30 puntos por perfil</small></h2>' +
                barrasRiasec +
            '</div>' +

            '<div class="rp-sec avoid">' +
                '<h2>Tus aptitudes percibidas <small>máximo 20 puntos por área</small></h2>' +
                '<p><strong>Área más destacada:</strong> ' + esc(APTITUDES[aptOrdenadas[0][0]].nombre) + '. ' + esc(lecturaApt) + '</p>' +
                barrasApt +
                '<p style="margin-top:8px;"><strong>Tus fortalezas autopercibidas:</strong> ' + esc(fortalezas.join(" y ")) + '.<br>' +
                '<strong>Áreas que podrías seguir desarrollando:</strong> ' + esc(aDesarrollar.join(" y ")) + '.</p>' +
                '<div class="note">Estas puntuaciones reflejan cómo evalúas tus propias habilidades; no son una medición objetiva ni una prueba de inteligencia. Para comprobarlas, conviene contrastarlas con notas, trabajos, actividades prácticas y evaluaciones.</div>' +
            '</div>' +

            '<div class="rp-sec avoid">' +
                '<h2>Áreas de estudio para explorar</h2>' +
                '<p>Estas alternativas se relacionan con tus dos intereses más altos (' + esc(PERFILES[p1[0]].nombre) + ' + ' + esc(PERFILES[p2[0]].nombre) + '). No son una elección definitiva ni un diagnóstico.</p>' +
                '<div class="chips">' + carreras.map(c => '<span class="chip">' + esc(c) + '</span>').join("") + '</div>' +
                '<p style="margin-top:8px;">También podrías explorar, según tu tercer perfil (' + esc(PERFILES[p3[0]].nombre) + '):</p>' +
                '<div class="chips">' + carrerasTercer.map(c => '<span class="chip alt">' + esc(c) + '</span>').join("") + '</div>' +
            '</div>' +

            '<div class="rp-sec avoid">' +
                '<h2>Próximos pasos sugeridos</h2>' +
                '<ul class="steps">' +
                    '<li>Revisa las mallas curriculares, requisitos de ingreso, costos, acreditación y campo laboral de las carreras que más te llamen la atención.</li>' +
                    '<li>Conversa con personas que ejerzan esas profesiones o con estudiantes que las estén cursando.</li>' +
                    '<li>Contrasta tus aptitudes percibidas con tus notas, trabajos y experiencias reales.</li>' +
                    '<li>Comenta este informe con tu orientador/a antes de tomar una decisión.</li>' +
                '</ul>' +
            '</div>' +

            seccionRespuestas +

            '<div class="legal avoid">Este cuestionario mide intereses declarados y aptitudes autopercibidas. No mide habilidades objetivas, rendimiento académico, personalidad completa ni empleabilidad, y no constituye una evaluación psicológica validada. Los resultados son una guía orientativa para apoyar tu proceso de decisión vocacional.</div>';
        }

        function generarPDF(index, btn) {
            if (!window.html2pdf) {
                alert("No se cargó html2pdf. Revisa tu conexión o recarga la página.");
                return;
            }
            const r = registrosGlobales[index];
            const molde = document.getElementById("pdfTemplate");
            const nombre = r.nombre_participante || "Participante";

            molde.innerHTML = construirInforme(r);
            molde.style.display = "block";
            if (btn) btn.disabled = true;

            const safeName = nombre.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9_-]+/g, "_");
            const terminar = () => { molde.style.display = "none"; if (btn) btn.disabled = false; };

            html2pdf().set({
                margin: [12, 12, 16, 12],
                filename: "Informe_Vocacional_" + safeName + ".pdf",
                image: { type: "jpeg", quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, backgroundColor: "#ffffff" },
                jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
                pagebreak: { mode: ["css", "legacy"], avoid: [".avoid", "tr"] }
            }).from(molde).toPdf().get("pdf").then(pdf => {
                const total = pdf.internal.getNumberOfPages();
                const w = pdf.internal.pageSize.getWidth();
                const h = pdf.internal.pageSize.getHeight();
                for (let i = 1; i <= total; i++) {
                    pdf.setPage(i);
                    pdf.setDrawColor(201, 162, 39);
                    pdf.setLineWidth(0.4);
                    pdf.line(12, h - 11, w - 12, h - 11);
                    pdf.setFontSize(8);
                    pdf.setTextColor(100, 116, 139);
                    pdf.text("Informe de Orientación Vocacional 2027 · " + nombre, 12, h - 7);
                    pdf.text("Página " + i + " de " + total, w - 12, h - 7, { align: "right" });
                }
            }).save().then(terminar).catch(err => {
                console.error("Error generando PDF:", err);
                terminar();
                alert("No se pudo generar el PDF. Revisa la consola para más detalles.");
            });
        }
    </script>
</body>
</html>
